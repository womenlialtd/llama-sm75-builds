name: release-step smoke test v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: ggml-org/llama.cpp
      # a tag that really exists in THIS repo (created by the b11213 build)
      REAL_TAG: sm75-llama-b11213
    steps:
      - name: Checkout upstream (this is what creates the trap)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: master
          fetch-depth: 1

      - name: Discriminating assertion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="$GITHUB_REPOSITORY"
          echo "GITHUB_REPOSITORY = $REPO"
          echo "probe tag           = $REAL_TAG (exists in OUR repo, not upstream)"
          echo

          echo "=== A) WITHOUT --repo (the old buggy form) ==="
          a=$(gh release view "$REAL_TAG" --json url --jq .url 2>&1); ra=$?
          echo "exit=$ra output=${a:0:200}"
          echo

          echo "=== B) WITH --repo \$GITHUB_REPOSITORY (the fix) ==="
          b=$(gh release view "$REAL_TAG" --repo "$REPO" --json url,assets \
                --jq '{url:.html_url,assets:[.assets[].name]}' 2>&1); rb=$?
          echo "exit=$rb output=${b:0:300}"
          echo

          echo "=== C) which repo does gh infer from CWD? ==="
          c=$(gh repo view --json nameWithOwner --jq .nameWithOwner 2>&1); rc_=$?
          echo "exit=$rc_ inferred=${c:0:120}"
          echo

          echo "=== VERDICT ==="
          fail=0
          if [ "$ra" -eq 0 ]; then
            echo "UNEXPECTED: no --repo found our release -> trap not reproduced"; fail=1
          else
            echo "OK: without --repo gh does NOT see our repo (it resolved elsewhere)"
          fi
          if [ "$rb" -eq 0 ] && printf '%s' "$b" | grep -q "$REPO"; then
            echo "OK: with --repo the release is found in $REPO"
          else
            echo "FAIL: with --repo did not resolve our release"; fail=1
          fi
          if printf '%s' "$c" | grep -q "ggml-org/llama.cpp"; then
            echo "OK: CWD origin resolves to upstream -> root cause confirmed"
          else
            echo "NOTE: gh inferred '$c'"; fail=1
          fi
          exit $fail
